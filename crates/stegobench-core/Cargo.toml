[package]
name = "stegobench-core"
description = "Result, run and manifest schemas, and the corpus model, for stegobench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/stegobench-core"
keywords = ["steganalysis", "steganography", "benchmark", "forensics", "schema"]
categories = ["science", "multimedia::images"]

[dependencies]
# The fetcher checks a download against a digest the registry declared in
# advance, so it needs one implementation of sha256. The same crate the plugin
# host and the CLI already use, rather than a second one for somebody to audit.
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
