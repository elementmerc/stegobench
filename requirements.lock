# The exact environment that built Pentimento Core v1.0.0.
#
# WHY THIS EXISTS BESIDE requirements.txt
#
# `requirements.txt` pins the seven packages we chose. This file is every
# package that was actually installed on the machine that produced the
# published corpus, which is not the same thing and, for this corpus, is the
# one that matters.
#
# THE PACKAGE THAT MADE THIS NECESSARY
#
# `conseal` compiles its cost maps with numba. The build environment carries
# compiled caches for `hugo/_costmap.compute_cost`, `GetLocalPotential` and
# `GetLocalDistortion`, so the function deciding WHICH PIXELS GET MODIFIED in
# the HUGO arm is JIT-compiled machine code, not interpreted Python.
#
# A different numba or llvmlite can emit different floating-point code for the
# same source: a fused multiply-add where the last one used two instructions,
# a different vectorisation, a different order of accumulation. Any of those
# moves a cost by an ulp, which moves the ranking of two nearly-equal pixels,
# which changes which pixel carries the payload, which changes the bytes.
#
# Neither numba nor llvmlite appeared in `requirements.txt`. They arrived as
# transitive dependencies and were never named, so the corpus was reproducible
# against a set of packages that nobody had written down.
#
# This is the same lesson the container images taught on the same day. The
# Dockerfile is the recipe and the image is the artefact; here, the
# requirements file is the recipe and this file is the artefact. Pinning what
# you chose is not the same as recording what you used.
#
# Install exactly this:
#   python3.14 -m venv .venv && .venv/bin/pip install -r requirements.lock
#
# Python 3.14.4, Linux x86_64.
