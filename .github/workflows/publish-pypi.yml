#
# THE PYTHON HALF, WHICH IS A DIFFERENT PRODUCT ON A DIFFERENT VERSION
#
# This publishes the corpus builder to PyPI as `pentimento-corpus`, which is
# the name on the index; the command it installs is `pentimento`. They differ
# because `pentimento` on PyPI was taken on 2026-09-25 by an unrelated project.
#
# It is NOT the harness: `stegobench` is four Rust crates going to crates.io,
# and that job already exists in `release.yml`.
#
# The two are separate products with separate version lines. `pyproject.toml`
# and the Rust workspace happen to read the same today and nothing keeps them
# that way, which is why this cannot hang off a `v*` tag: a tag means the
# harness, and the first time the corpus builder ships a fix on its own, a
# tag-triggered upload would stamp the harness's number on it.
#
# So the version is an input and it has to agree with `pyproject.toml`. Typing
# it is the point: it is the moment somebody confirms which of the two things
# they are releasing.
#
# TRUSTED PUBLISHING, SO THERE IS NO TOKEN HERE
#
# PyPI trades this workflow's OIDC identity for a short-lived token. There is
# no `PYPI_API_TOKEN` secret to leak, rotate or find in a log. The trust
# relationship is created once on PyPI by hand and cannot be created from
# here; `tools/release/RELEASING.md` is where that checklist belongs.
#
# WHY IT NEVER FIRES ON ITS OWN
#
# A version on PyPI cannot be replaced, and a name cannot be reclaimed. There
# is no `push:` trigger and no schedule. The default dispatch builds the
# artefacts and checks them WITHOUT publishing; `publish` has to be set, and
# the index defaults to TestPyPI so the first accidental publish lands
# somewhere that does not matter.
name: Publish pentimento to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version being published. Must match pyproject.toml exactly."
        type: string
        required: true
      index:
        description: "Which index to publish to."
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      publish:
        description: "Upload. Left false, this builds and checks the artefacts and uploads nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  distribution:
    name: Build the sdist and wheel, and check them
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.facts.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The declared version and the typed version must agree
        id: facts
        run: |
          set -euo pipefail
          declared="$(python3 -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          typed="${{ inputs.version }}"
          if [ "${declared}" != "${typed}" ]; then
            echo "::error::pyproject.toml declares ${declared} and this run was asked for ${typed}." >&2
            echo "Bump pyproject.toml or dispatch with the version it actually carries." >&2
            exit 1
          fi
          echo "version=${declared}" >> "${GITHUB_OUTPUT}"
          echo "Publishing pentimento ${declared}."

      - name: Install the build tools, pinned
        # Exact versions, not ranges. A release artefact whose shape changes
        # because a build backend updated between two releases is an artefact
        # nobody can compare, which is the same argument release.yml makes for
        # pinning cargo-cyclonedx.
        run: python3 -m pip install --disable-pip-version-check build==1.6.1 twine==7.0.0

      - name: Build
        run: python3 -m build

      - name: Check what was built
        run: |
          set -euo pipefail
          ls -l dist
          # Metadata and long description, which is what PyPI renders. A README
          # that fails to render is a landing page nobody can read, and it is
          # rejected at upload rather than fixed afterwards.
          python3 -m twine check --strict dist/*

          # The declared version has to be the one in the filenames, because
          # the filename is what the index keys on.
          #
          # `pentimento_corpus`, with an underscore, is not a typo for the
          # `pentimento-corpus` in pyproject.toml. PEP 625 says the filename
          # carries the NORMALISED name, which lowercases and turns runs of
          # `-`, `_` and `.` into a single `_`. These two assertions are
          # therefore also what checks the distribution did not get renamed by
          # accident, which matters more than usual here: the obvious name is
          # taken on PyPI by somebody else, so a silent revert to it would be
          # rejected at upload with an error about permissions rather than
          # about the name.
          version="${{ steps.facts.outputs.version }}"
          test -f "dist/pentimento_corpus-${version}.tar.gz" \
            || { echo "::error::No sdist named for ${version}." >&2; exit 1; }
          ls "dist/pentimento_corpus-${version}-"*.whl > /dev/null \
            || { echo "::error::No wheel named for ${version}." >&2; exit 1; }

          # The entry point `pip install pentimento-corpus` is meant to put on
          # PATH, and it is `pentimento` rather than the distribution name.
          # Checked by reading the wheel rather than by installing it: the
          # dependencies are numpy, scipy, opencv and jpeglib, so a real
          # install smoke test is a several minute download that CI already
          # does in `ci.yml` against the source tree. This checks the one
          # thing packaging can silently drop.
          python3 - <<'PY'
          import glob, zipfile, sys
          # `pentimento_corpus`, the normalised distribution name, not the
          # `pentimento` command the wheel installs. Indexing a glob that
          # matched nothing is what made this fail with an IndexError and no
          # sentence, so say which name was expected when it is not there.
          wheels = glob.glob("dist/pentimento_corpus-*.whl")
          if not wheels:
              sys.exit(f"no wheel matching dist/pentimento_corpus-*.whl; dist holds {sorted(glob.glob('dist/*'))}")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              entry = [n for n in names if n.endswith("entry_points.txt")]
              if not entry:
                  sys.exit("the wheel declares no entry points, so `pentimento` would not be on PATH")
              text = z.read(entry[0]).decode()
          print(text)
          # Whitespace around the `=` is the packaging tool's business and has
          # changed between setuptools releases, so it is normalised away
          # rather than being a thing this check can fail on spuriously.
          flat = "".join(text.split())
          if "pentimento=generators.cli:main" not in flat:
              sys.exit("the `pentimento` console script is missing from the wheel")
          print(f"{wheel}: console script present")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pentimento-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to ${{ inputs.index }}
    needs: distribution
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    # The environment is what PyPI's trusted publisher is bound to, and what
    # a required reviewer would be attached to in repository settings. Naming
    # one here is what makes "this workflow, in this environment" a condition
    # the index can check rather than a claim this file makes about itself.
    environment: ${{ inputs.index }}
    permissions:
      # The whole point: PyPI trades this for a short-lived token. No stored
      # credential exists to leak.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pentimento-dist
          path: dist
      - name: Upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2, tagged 2026-07-29
        with:
          # TestPyPI is a different host with its own trusted publisher, and
          # leaving this to a default is how a test upload lands on the real
          # index.
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # PEP 740 attestations, signed with the same OIDC identity. They say
          # which workflow in which repository produced these files, which is
          # the half a checksum does not give.
          attestations: true
          print-hash: true
