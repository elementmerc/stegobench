#
# Publish both documentation sites to GitHub Pages.
#
# TWO SITES, ONE PAGES DEPLOYMENT
#
# Stegobench is a harness people run. Pentimento is a corpus people download.
# They have different readers and they are documented separately, which is the
# point of the split.
#
# GitHub Pages serves one site per repository, so until Pentimento has a
# repository of its own the two are published into one deployment: Stegobench
# at the root and Pentimento under `/pentimento/`. That is the honest
# arrangement rather than the ideal one, and the cost is that Pentimento's URL
# currently sits inside Stegobench's.
#
# WHEN PENTIMENTO GETS ITS OWN REPOSITORY
#
# The whole `pentimento/` directory moves across unchanged, its `base` goes
# back to `/pentimento/` for the new host, and the second half of the build
# job below is deleted. Nothing else needs to move, which is why its docs and
# its config live in one self-contained folder.
#
# WHY THIS DOES NOT RUN ON A PUSH YET
#
# GitHub Pages is not available for a private repository on a free plan.
# Enabling it returns, verbatim: "Your current plan does not support GitHub
# Pages for this repository." So while Stegobench is private this workflow can
# only fail, and a red check that everybody learns to ignore costs more than it
# reports.
#
# It is therefore manual for now. Both sites are still built and link-checked
# by the `docs` job in ci.yml on every push, so a broken link fails
# immediately.
#
# WHEN THE REPOSITORY GOES PUBLIC, two lines:
#   1. enable Pages with Actions as the source
#   2. put `push: {branches: [dev]}` back under `on:` here
name: Documentation sites

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a cancelled deploy
# can leave the published site mid-swap, and the queued run that follows would
# publish the same content anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build both sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `lastUpdated` reads each page's git history. A shallow clone gives
          # every file the tip commit's date, so the whole site would claim to
          # have been updated on the day it was built.
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Install Stegobench's site, from the lockfile only
        working-directory: docs
        run: npm ci
      - name: Build Stegobench's site
        working-directory: docs
        run: npm run build

      - name: Install Pentimento's site, from the lockfile only
        working-directory: pentimento/docs
        run: npm ci
      - name: Build Pentimento's site
        working-directory: pentimento/docs
        # Nested under Stegobench's base for as long as they share a
        # repository. The site is otherwise unchanged by living here.
        env:
          DOCS_BASE: /stegobench/pentimento/
        run: npm run build

      - name: Put the corpus site inside the harness site
        run: |
          set -euo pipefail
          mkdir -p docs/.vitepress/dist/pentimento
          cp -r pentimento/docs/.vitepress/dist/. docs/.vitepress/dist/pentimento/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    # Scoped to this job alone. The build job, which runs `npm ci` over two
    # dependency trees, gets neither of these.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      # A build whose output reaches no consequence is a failure shape worth
      # guarding against: a site can be built and link-checked on every push
      # for the life of a project while its published README links return 404,
      # because nothing ever fetches the published site. This does.
      - name: Both sites' entry points resolve once published
        run: |
          set -uo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          rc=0
          for path in "" "/guide/what-it-is" "/guide/quickstart" \
                      "/pentimento/" "/pentimento/guide/get-it" \
                      "/pentimento/guide/licence"; do
            url="$base$path"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ok   $code  $url"
            else
              echo "::error::$url returned $code, so a documented entry point is dead for every reader"
              rc=1
            fi
          done
          exit "$rc"
