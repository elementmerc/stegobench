#
# THE REPOSITORY HAD NO CI AT ALL UNTIL THIS FILE
#
# Everything here was verified on one Linux machine with one Python and one set
# of wheels. The corpus documentation says anybody can rebuild the corpus, and
# nothing had ever checked that claim on any other platform.
#
# The generators are the part that has to be portable, because they are what a
# reader runs. So they get the three operating systems, and the Rust workspace
# gets one: the crates are a harness we run, not an artefact anybody rebuilds,
# and a compiler that is green on Linux is not usefully rechecked twice more.
#
# WHY NOT A CONTAINER
#
# A Linux host cannot run Windows or macOS containers, so a container proves
# only the platform we already had. Runners are the honest way and they are the
# reason this file exists rather than a Dockerfile.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# Read-only by default. No job here needs to write anything back.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generators:
    name: Generators, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is information about that platform, so let the
      # others finish and report rather than losing the comparison.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install, from the pinned set only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        # The generators' tests run on the standard library's own runner, so
        # they need nothing beyond `requirements.txt`. A suite that only runs
        # where one extra package happens to be installed is a suite that
        # quietly stops running.
        run: python -m unittest discover -s generators -p "test_*.py" -v
      - name: Release tooling tests
        # The shared bandwidth budget is timing sensitive and uses flock, so it
        # is the one piece here whose behaviour genuinely differs per platform.
        run: python -m unittest discover -s tools/release -p "test_*.py" -v
      - name: Coverage tooling tests
        # The tool that holds this repository to a coverage figure is held to
        # one too. It arrived without tests, and the first thing they found was
        # that a component the floors file had never heard of was skipped in
        # silence, so a new crate would have been measured and never gated.
        run: python -m unittest discover -s tools/coverage -p "test_*.py" -v

  tiers:
    name: Tiers on ${{ matrix.os }}, Nano built, all three selected
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install, from the pinned set only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Select Nano, Lite and Core, then build, pack and check Nano
        # The job name says which tier is built and which are only selected,
        # because building Core is roughly six days of CPU and claiming it ran
        # in CI would be exactly the sort of unbacked claim this repository
        # exists to argue against. What the selection check proves is the
        # prefix guarantee, which is the property that silently inflates
        # somebody else's published accuracy when it breaks.
        run: python tools/ci/tier_smoke.py

  # The generators run on all three because they are what a reader runs. The
  # harness did not, and that was a gap rather than a decision: it registers
  # tools that only exist on one platform, so it has to be the thing that says
  # so, on the platform it is saying it from.
  rust:
    name: Rust workspace, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # rustup ships on the runner and `rust-toolchain.toml` pins the version,
      # so the toolchain is pinned without a third-party action in the way.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # No cargo cache yet: every action here is pinned by commit hash per
      # baseline section 5, and adding one means finding and recording the
      # hash rather than taking a tag. The workspace is small enough that a
      # cold build is not worth an unpinned dependency.
      - name: Formatting
        run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - name: Lints, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Windows compiles but does not yet run the tests, and the split is honest
  # rather than convenient. The library code is already gated where it touches
  # Unix, so a compile failure here is a real portability regression and worth
  # catching. The TESTS are a different matter: a dozen of them drive a shell
  # script as a stand-in detector, which is the right fixture on a Unix box and
  # is not a thing on Windows. Running a suite that skips its own subject would
  # report a green tick for having checked nothing, and that is the failure
  # this project exists to complain about elsewhere.
  rust-windows:
    name: Rust workspace compiles on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Compile, including the test targets
        run: cargo check --workspace --all-targets

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # WHAT AN AUDIT TOOL DOES AND DOES NOT CATCH
    #
    # Both tools below compare our dependency set against a database of
    # advisories somebody has already published. That catches the known and
    # nothing else: a package compromised this morning is not in any database
    # this afternoon, and the credential-harvesting cascades that make the
    # dependency graph worth worrying about run on exactly that gap. The two
    # defences that do cover it are the seven day cooldown in `renovate.json`,
    # which keeps a version out until the window in which most compromises are
    # found has passed, and not running untrusted builds as the user who holds
    # the keys. This job is the third layer, not the only one.
    #
    # It fails rather than warns. An advisory that prints in green text is one
    # everybody learns to scroll past, and this job is worth nothing the day
    # that happens.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-audit
        # Deliberately not pinned to a version, which is the one exception to
        # the pinning rule in this file and needs saying out loud. An audit
        # tool held at an old version stops recognising the advisory format it
        # is there to read, so freezing it defeats the job. The exposure is
        # bounded: it runs in a throwaway runner, in a job with read-only
        # permissions, with no credentials to take.
        run: cargo install cargo-audit --locked
      - name: Rust advisories
        # `--deny warnings` makes an unmaintained or yanked crate fatal too.
        # That means an advisory published upstream can turn this red with no
        # commit of ours in between, and that is the intended reading: the job
        # reports on the dependency set, not on the last change to it.
        run: cargo audit --deny warnings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pip-audit
        # Unpinned for the same reason as cargo-audit above.
        run: python -m pip install --upgrade pip pip-audit
      - name: Python advisories
        # `requirements.txt` only. `requirements.lock` is deliberately left
        # out: it records the environment that produced the published corpus
        # rather than the one we intend to install, so auditing it would turn
        # this job permanently red for a historical fact nobody can change.
        # `--strict` fails on a dependency the tool could not resolve, so a
        # package skipped for being unreadable is a failure rather than a pass.
        run: pip-audit --requirement requirements.txt --strict

  # COVERAGE, AND WHY THE GATE IS A RATCHET RATHER THAN A FLAT 90%
  #
  # CLAUDE.md Section 7 asks for at least 90% branch coverage on CHANGED
  # files. Until these two jobs existed, nothing in this repository had ever
  # measured that; every claim of meeting it was a count of tests written.
  #
  # Three things had to be true of whatever went in here, and they pull
  # against each other:
  #
  #   1. The rule is about changed files, not the whole tree. A whole-tree
  #      gate at 90% fails on its first run, on code nobody is touching. The
  #      first measurement, on 2026-09-28, was 44.54% for `generators` and
  #      68.05% for `tools/release`; only the Rust workspace, at 90.42%,
  #      would have cleared it. Section 6 is explicit that pre-existing
  #      problems on untouched code are left alone.
  #   2. A job that is red for a reason nobody intends to fix is a job people
  #      learn to scroll past. This repository already carries that lesson:
  #      `docs.yml` is `workflow_dispatch` only because a permanently red
  #      check costs more than it reports. A second one would be worse than
  #      no coverage job at all.
  #   3. A job that only prints a number and never fails is decorative.
  #
  # So the gate is a RATCHET. `tools/coverage/floors.toml` records the
  # coverage already reached, per component, in the repository where anybody
  # can read it and its history shows every move. A run below its floor fails
  # loud; a run above it passes and says the floor can be raised. The floor
  # only ever goes up, by a deliberate `--bump` commit, never by CI writing
  # to the repository behind anybody's back. That satisfies (1) because
  # today's low figures are recorded rather than punished, (2) because the
  # first run is green by construction, and (3) because a genuine regression
  # is a failure rather than a smaller number in a log.
  #
  # The 90% rule itself is not abandoned: both jobs print every file under
  # 90% into the run summary, so a reviewer looking at a pull request can see
  # in one place whether the files it touched are on that list. That is
  # reported rather than enforced on purpose. A one-line typo fix in a
  # module sitting at 6% would otherwise turn a pull request red and demand
  # a test-writing project nobody asked for, which is failure mode (2) with
  # extra steps. The honest division is that the machine holds the line and
  # a human reads the list.
  #
  # The floors were set one whole point under the developer-machine
  # measurement because no runner had produced a figure yet. After the first
  # green run here, bump them to what the runner reports.
  coverage-python:
    name: Coverage, Python half
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install, from the pinned set only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install coverage.py
        # Pinned, and deliberately not added to `requirements.txt`: that file
        # is what a reader installs to build the corpus, and a measurement
        # tool is not part of building it. 7.16.0 was uploaded on 2026-08-28
        # and pinned on 2026-09-28, so it was 31 days old and well past the
        # seven day cooldown in baseline Section 5.
        run: python -m pip install coverage==7.16.0
      - name: Measure, and hold the floor
        # Runs both suites exactly as the `generators` job discovers them, so
        # a figure here is measured on the same tests that job reports on.
        run: python tools/coverage/measure.py python --summary "$GITHUB_STEP_SUMMARY"

  coverage-rust:
    name: Coverage, Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the LLVM tools the instrumentation needs
        # Not added to `rust-toolchain.toml`, because that file governs every
        # build in the repository and this component is needed by one job.
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        # Pinned by version, unlike `cargo-audit` above. The reason that one
        # floats is that an audit tool frozen at an old version stops reading
        # the advisory format it exists to read. A coverage tool has no such
        # problem, and a floating one would move the measured figure without
        # a commit of ours in between, which is exactly what a ratchet must
        # not have under it. 0.8.7 was published on 2026-05-13 and pinned on
        # 2026-09-28, so it was 138 days old and past the cooldown.
        run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - name: Measure, and hold the floor
        # One crate at a time rather than `--workspace`: an instrumented
        # workspace build is heavy enough to be killed by a memory limit on a
        # developer machine, and `cargo llvm-cov report` merges the profiles
        # afterwards into the same combined figure.
        #
        # This is REGION coverage, not branch coverage, and the distinction is
        # written down rather than glossed. `cargo llvm-cov --branch` requires
        # a nightly compiler and `rust-toolchain.toml` pins stable on purpose.
        run: python3 tools/coverage/measure.py rust --summary "$GITHUB_STEP_SUMMARY"

  docs:
    name: ${{ matrix.name }} documentation builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One site. The corpus that used to be documented here has its own
          # repository now, and builds its own docs there.
          - name: Stegobench
            path: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Install, from the lockfile only
        working-directory: ${{ matrix.path }}
        run: npm ci
      - name: Build, which fails on a dead link
        # `ignoreDeadLinks` is unset, so any broken internal link fails here.
        working-directory: ${{ matrix.path }}
        run: npm run build
