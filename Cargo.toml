[workspace]
resolver = "2"
members = [
    "crates/stegobench-core",
    "crates/stegobench-metrics",
    "crates/stegobench-plugin",
    "crates/stegobench-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
authors = ["Daniel Iwugo"]
repository = "https://github.com/elementmerc/stegobench"
homepage = "https://github.com/elementmerc/stegobench"
# One README for four crates, inherited rather than copied. An inherited
# `readme` resolves against the workspace root and Cargo packages a copy into
# each crate, so crates.io renders the same page the repository shows and there
# is no second copy to drift from the first.
readme = "README.md"

[workspace.dependencies]
# The in-workspace crates carry a path and a version together. The path is what
# a local build resolves against; the version is what crates.io resolves
# against, and a path dependency without one cannot be published at all. Both
# live here so the four crates can only ever be released at one version.
stegobench-core = { path = "crates/stegobench-core", version = "1.0.0" }
stegobench-metrics = { path = "crates/stegobench-metrics", version = "1.0.0" }
stegobench-plugin = { path = "crates/stegobench-plugin", version = "1.0.0" }

# Kept deliberately small. Every entry here runs with our privileges and is
# reviewed like any other design decision (baseline Section 5). Anything that
# three lines of our own code would replace does not get added.
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is load-bearing, not a tuning knob. Without it serde_json
# parses with a fast algorithm that is not bit-exact: `0.9065609581885931`
# comes back as a float that re-serialises to `...932`. The content digest is
# computed over the PARSED document, so a result carrying such a value sealed
# correctly, was written correctly, and then failed its own seal the moment
# anything read it back. Only about one float in a few hundred is affected,
# which is why it presented as "documents with interesting numbers are
# corrupt and documents with round numbers are fine".
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[profile.release]
# A benchmark that reports a wrong number because of an arithmetic wrap is
# worse than one that stops, and the harness is IO bound anyway.
overflow-checks = true
