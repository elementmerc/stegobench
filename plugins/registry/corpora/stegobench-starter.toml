# The starter corpus: what a fresh install can score before it has downloaded
# anything, and deliberately not a benchmark.
#
# IT IS NOT A PENTIMENTO TIER AND IT IS NOT NAMED LIKE ONE.
#
# Nano, Lite and Core are strict prefixes of one another over one ordering of
# real photographs. This is six synthetic images and is a prefix of nothing, so
# it carries this project's name rather than the corpus's. A reader who saw
# `pentimento-starter` would reasonably assume it was the smallest tier, and it
# is not a tier at all.
#
# `demonstration = true` is the load-bearing line. A demonstration entry is
# forbidden by `CorpusEntry::validate` from declaring `integrity.records_sha256`,
# and that digest is the only thing that lets `stegobench score` mark a run
# `named`. So every run over this corpus comes out `custom`, which `result-v1`
# already defines as comparable with itself and nothing else. The marking is
# structural rather than a warning somebody has to read.
id = "stegobench-starter"
name = "Stegobench starter corpus"
description = """
Six synthetic greyscale covers and twelve LSB stego images made from them, \
shipped inside this repository so a fresh install has something to score. It \
is a demonstration, not a measurement: six covers is few enough that one \
picture moves the AUC by a tenth, and the covers are generated rather than \
photographed, so nothing calibrated here transfers to real images. Every pair \
comes out of one array through one writer, so the pairing rule holds and the \
machinery a real run exercises is the machinery this exercises.\
"""
demonstration = true

[licence]
status = "verified"
spdx = "AGPL-3.0-or-later"
url = "https://www.gnu.org/licenses/agpl-3.0.en.html"
verified_on = "2026-09-28"
source = """
The repository's own LICENSE file, read on that date. These images are not \
somebody else's photographs under somebody else's terms: they are generated by \
`corpora/starter/build.py` from a fixed seed and ship inside this repository, \
so they carry the repository's licence. Recorded as what was read rather than \
as a friendlier label chosen because a starter corpus deserves one.\
"""
redistribution = "permitted"
redistribution_reason = """
The AGPL permits redistribution of the work and of modified versions, under \
the same licence. These files are part of this repository and travel with it.\
"""
attribution_required = true
share_alike = true
note = """
A starter corpus under a share-alike licence is a deliberate answer rather \
than a default. The friendlier answer would be a public domain dedication, and \
that is a grant the copyright holder has to issue; until one is issued, saying \
the repository's licence applies is the only thing anybody has actually read. \
Scoring a detector against these images is use rather than redistribution, and \
nothing about the licence constrains a number measured over them.\
"""

[obtain]
instructions = """
It is already here. Point `stegobench score` at `corpora/starter` in a checkout \
of this repository; there is nothing to download, which is the entire point of \
it existing.

`python3 corpora/starter/build.py --check` rebuilds it into a temporary \
directory and compares the result byte for byte, so the shipped files can be \
proved to be the ones the script produces.\
"""
requires_acceptance = false

# NO [integrity] BLOCK, AND IT IS FORBIDDEN FROM HAVING ONE.
#
# `records_sha256` is what earns a run the `named` configuration, and a named
# run over six images is a number somebody will quote. `validate` refuses the
# combination rather than trusting anyone to leave it out.
#
# NO [[download]] BLOCK EITHER, FOR THE SAME KIND OF REASON.
#
# A corpus small enough to demonstrate with is small enough to ship, and a
# demonstration nobody can run without a network is not a demonstration.

[properties]
base_images = 6
total_images = 18
formats = ["png"]
paired = true
size_note = """
Roughly 650 KB on disk: eighteen 256x256 greyscale PNGs and their records. \
Small enough that it costs a clone nothing, which is the only size a corpus \
inside a source repository may be.\
"""
