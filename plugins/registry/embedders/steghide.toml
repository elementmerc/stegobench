name = "steghide"
kind = "embedder"
licence = "GPL-2.0"
redistribution = "forbidden"
redistribution_reason = """
GPL-2.0, and forbidden for the same reason as openstego: GPL-2 section 3
wants the corresponding source accompanying the binary or our own written
offer, and has no equivalent of GPL-3 section 6(d). The tool arrives as a
Debian package, so the corresponding source is in Debian's archive and
mirroring it is a small bounded job rather than a hard problem.

Also an embedder, so it blocks nothing today.
"""
maintainer = "third_party"
notes = "JPEG and BMP. The everyday case, and nothing in the panel detects it."

[image]
reference = "stegobench/steghide@sha256:69ecb87c0f9cf99ff48636b1de7d7f8ea56d84d508cf65e5486e0acbe3c97150"
size_mb = 120
bundled = true

[emits]
output = "score"

[accepts]
formats = ["jpeg"]

[cost]
seconds_per_image = 0.4
peak_rss_mb = 300
cores_per_worker = 1

[roundtrip]
# JPEG, because steghide does not take PNG. -q silences it, -f overwrites the
# staged file rather than prompting, and -p carries the passphrase.
cover = "fixtures/clean.jpg"
embed_argv = ["embed", "-cf", "{cover}", "-ef", "{payload}", "-sf", "{stego}",
              "-p", "{passphrase}", "-q", "-f"]
extract_argv = ["extract", "-sf", "{stego}", "-xf", "{recovered}",
                "-p", "{passphrase}", "-q", "-f"]
