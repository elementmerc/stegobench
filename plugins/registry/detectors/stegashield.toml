# The subject of the September 2026 evaluation, registered so FiveInsights can
# reproduce every number in that report themselves, on the same bytes, with one
# command. A report you can check beats a report you have to trust.
#
# THE LICENCE TOKEN IS SUPPLIED BY WHOEVER RUNS IT.
#
# `secrets` names an environment variable and never holds a value. The harness
# reads it at run time, passes it to the container with --env, and fails with a
# clear message when it is missing. It does not reach a log, a manifest or a
# result. The image is NOT vendored: it is a third party's artefact and we have
# no right to redistribute it, so it is referenced by digest and pulled.
name = "stegashield"
kind = "detector"
upstream = "https://hub.docker.com/r/5iprojects/stegashield"
licence = "proprietary"
redistribution = "forbidden"
redistribution_reason = """
Proprietary, and nothing to decide: this entry names the vendor's own image
under the vendor's own namespace, so a user's container runtime pulls it from
them and we never hold or serve a copy. Forbidden here means we must not mirror
it, not that a user cannot run it.
"""
maintainer = "subject"
secrets = ["STEGASHIELD_LICENCE"]
notes = "Evaluated September 2026. Never used as a reference detector for anything."

[image]
reference = "5iprojects/stegashield@sha256:64a6a378550f479c572c689bdb0af284cd81971e591a72077a6e74f7a97ea0e5"
size_mb = 1250
bundled = false
needs_network = false

[emits]
output = "score"
higher_means_stego = true

[accepts]
formats = ["png", "jpeg"]
max_pixels = 16000000

[cost]
seconds_per_image = 0.9
peak_rss_mb = 1400
cores_per_worker = 1

[invoke]
# A SERVICE, not a command: there is nothing to run inside the image, so the
# adapter runs here and posts to a running instance. STEGASHIELD_ENDPOINT
# names it and has no default, because a benchmark that ships an address
# scores against whatever answers on it.
#
# The licence token is consumed when the CONTAINER starts, not per request, so
# this adapter never sees it. Supplying it is whoever runs the service's job,
# which is why it is declared in secrets above and not here.
host = true
adapter = "plugins/adapters/stegashield_one.py"
entrypoint = "python3"
argv = ["{adapter}", "{file}"]
# The NAME of the variable, never its value. Naming it is what lets `doctor`
# and `score` say "you have not told us where your instance is" before a run
# starts, instead of leaving it to be discovered image by image as the
# adapter's own refusal once a corpus is already under way.
endpoint_env = "STEGASHIELD_ENDPOINT"
#
# WHAT TO SUPPLY, AND WHY IT IS NOT SUPPLIED HERE
# -----------------------------------------------
# The shape of the address, recovered from the evaluation's own session
# records on 2026-09-18 and written down because it was lost once already:
#
#     STEGASHIELD_ENDPOINT=http://<host>:<port>/api/analyze
#
# The route is `/api/analyze` (the vendor's spelling, so it stays American)
# and the container serves it on port 3000 unless you moved it. Check that it
# is free before you start: 3000 is a common default and something else may
# already hold it, in which case the probes reach that instead and answer with
# whatever it serves. The host is yours and only yours: the instance runs on
# whatever machine or docker network you start it on, and it is normally an
# internal one with no route to the internet.
#
# It is a comment and not an `env` line on purpose. A value here would be a
# DEFAULT, and a default address is scored against whatever answers on it, so
# a result would name StegaShield while measuring whoever happened to be
# listening. It would also publish one team's internal address to everybody
# who clones this repository. The harness passes your environment through to
# the adapter, so exporting the variable before the run is all it takes; the
# adapter refuses with the line above when it is unset.
parser = "number"

[selftest]
must_detect = "fixtures/lsb-0.4bpp.png"
must_clear = "fixtures/clean.png"
# It reports a probability, so the natural midpoint applies. Note the measured
# result on real corpora is that this detector sits near chance on most arms;
# the fixture is deliberately far louder than anything it was evaluated on.
threshold = 0.5
