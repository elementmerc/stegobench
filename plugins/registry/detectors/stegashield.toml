# The subject of the September 2026 evaluation, registered so FiveInsights can
# reproduce every number in that report themselves, on the same bytes, with one
# command. A report you can check beats a report you have to trust.
#
# THE LICENCE TOKEN IS SUPPLIED BY WHOEVER RUNS IT.
#
# `secrets` names an environment variable and never holds a value. The harness
# reads it at run time, passes it to the container with --env, and fails with a
# clear message when it is missing. It does not reach a log, a manifest or a
# result. The image is NOT vendored: it is a third party's artefact and we have
# no right to redistribute it, so it is referenced by digest and pulled.
name = "stegashield"
kind = "detector"
upstream = "https://hub.docker.com/r/5iprojects/stegashield"
licence = "proprietary"
maintainer = "subject"
secrets = ["STEGASHIELD_LICENCE"]
notes = "Evaluated September 2026. Never used as a reference detector for anything."

[image]
reference = "5iprojects/stegashield@sha256:64a6a378550f479c572c689bdb0af284cd81971e591a72077a6e74f7a97ea0e5"
size_mb = 1250
bundled = false
needs_network = false

[emits]
output = "score"
higher_means_stego = true

[accepts]
formats = ["png", "jpeg"]
max_pixels = 16000000

[cost]
seconds_per_image = 0.9
peak_rss_mb = 1400
cores_per_worker = 1

[invoke]
# A SERVICE, not a command: there is nothing to run inside the image, so the
# adapter runs here and posts to a running instance. STEGASHIELD_ENDPOINT
# names it and has no default, because a benchmark that ships an address
# scores against whatever answers on it.
#
# The licence token is consumed when the CONTAINER starts, not per request, so
# this adapter never sees it. Supplying it is whoever runs the service's job,
# which is why it is declared in secrets above and not here.
host = true
adapter = "plugins/adapters/stegashield_one.py"
entrypoint = "python3"
argv = ["{adapter}", "{file}"]
parser = "number"

[selftest]
must_detect = "fixtures/lsb-0.4bpp.png"
must_clear = "fixtures/clean.png"
# It reports a probability, so the natural midpoint applies. Note the measured
# result on real corpora is that this detector sits near chance on most arms;
# the fixture is deliberately far louder than anything it was evaluated on.
threshold = 0.5
