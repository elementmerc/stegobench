# A fusion of four classical statistics. The tool a practitioner is most likely
# to have already tried.
name = "stegexpose"
kind = "detector"
upstream = "https://github.com/b3dk7/StegExpose"
# NONE GRANTED, and this said GPL-3.0 with nothing behind it. Checked inside
# the pinned image on 2026-09-30: the cloned repository has no LICENSE file,
# no COPYING file, and its README has no licence section, so nothing upstream
# grants any permission and the default under copyright is that none is given.
#
# It's the failure this project was built to correct, sitting in our own
# registry: a licence somebody wrote down once from an impression rather than
# from a document. It cost nothing until we went to publish the image, and
# then it was the difference between a mirror we may lawfully serve and one we
# may not.
#
# Running it locally is unaffected. Redistributing the image is not, so the
# image stays unpublished until the author is asked.
licence = "none-granted"
maintainer = "third_party"

[image]
reference = "stegobench/stegexpose@sha256:70c545a890a0e0b1695998525b6d4fa270ece2619108e9a80286f237593980b5"
size_mb = 512
bundled = true

[emits]
output = "score"

[accepts]
formats = ["png", "jpeg", "bmp"]

[cost]
# MEASURED 2026-10-02: 553 images in about 13 minutes, so 1.4 seconds per image
# end to end, against a declared 0.3. As with zsteg the difference is not the
# tool but the per image container start, plus a JVM to launch inside it.
seconds_per_image = 1.4
peak_rss_mb = 900
cores_per_worker = 1

[invoke]
# StegExpose takes <directory> <speed> <threshold> <csv out>, scans the whole
# directory, and writes its numbers to the file you name. Handed a read-only
# mount it prints nothing and exits zero, which is silence that reads exactly
# like "found nothing", so it needs a writable working directory.
argv = ["/work", "default", "0.2", "/work/stegexpose.csv"]
writable_workdir = true
output_file = "/work/stegexpose.csv"
parser = "stegexpose"

[selftest]
# The RGB fixtures. StegExpose analyses colour planes and prints no row at all
# for a greyscale PNG, exiting zero having said nothing.
must_detect = "fixtures/lsb-0.4bpp-rgb.png"
must_clear = "fixtures/clean-rgb.png"
# StegExpose's own default. Measured on these fixtures: the clean one fuses to
# 0.0185 and the stego one to 0.3815, so 0.2 sits between them with room on
# both sides rather than being tuned to squeeze past.
threshold = 0.2
