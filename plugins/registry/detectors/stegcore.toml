# Stegcore's own analysis ensemble: SPA, RS and WS with calibrated thresholds.
#
# IT IS HERE AS A SUBJECT, NOT AS A YARDSTICK.
#
# stegobench must not be built out of the product it judges, so Stegcore is
# reached through exactly this file, the same way zsteg is, with no privileged
# path anywhere in the harness. maintainer = "us" is what keeps it out of the
# ranking: a benchmark run by a participant is not trusted, and mechanism is a
# better answer to that than a promise.
#
# A binary rather than an image, for an honest reason: the published container
# could not be resolved without a token scope nobody should need in order to run
# a benchmark. The executable is hashed at run time instead, which pins it
# harder than a tag would.
name = "stegcore"
kind = "detector"
upstream = "https://github.com/The-Malware-Files/Stegcore"
licence = "AGPL-3.0-or-later"
maintainer = "us"
notes = "Strong on spatial LSB and structural fingerprints; weak at low payload; blind in the JPEG DCT domain. Stated here so a null result is not read as a finding."

[binary]
command = ["stegcore", "analyse", "--json"]
# 8.6 MB, measured from a release build 2026-09-18. Bundled without
# question: a binary this size is free against an image measured in hundreds.
size_mb = 9
version_args = ["--version"]

[emits]
output = "score"
higher_means_stego = true

[accepts]
formats = ["png", "jpeg", "bmp", "wav", "flac"]

[cost]
seconds_per_image = 0.2
peak_rss_mb = 260
cores_per_worker = 1

[invoke]
# The binary's own command already carries "analyse --json", so this only adds
# the file. No container: a binary entry means the operator installed this
# program themselves, which is a different statement from pulling a stranger's
# image and gets a different level of isolation.
argv = ["{file}"]
parser = "stegcore"

[selftest]
must_detect = "fixtures/lsb-0.4bpp.png"
must_clear = "fixtures/clean.png"
# Measured on these fixtures: 0.0218 clean, 0.4192 stego. A smoke-test
# decision point; the shipped thresholds are calibrated against a
# false-positive budget on real corpora and are not this number.
threshold = 0.2
