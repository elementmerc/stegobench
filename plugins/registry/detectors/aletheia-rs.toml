# Regular/Singular. Note it spawns its own worker processes, so the host shards
# it across containers rather than pooling inside one: pooling produced
# "daemonic processes are not allowed to have children" AFTER SPA had already
# succeeded, leaving records that looked half filled.
name = "aletheia-rs"
kind = "detector"
upstream = "https://github.com/daniellerch/aletheia"
licence = "MIT"
maintainer = "third_party"

[image]
reference = "stegobench/aletheia@sha256:3f19136f8f3e1479fc60e9986d8d2431818ca6dc4471ae1e49c5076acfccf87d"
size_mb = 8340
bundled = false

[emits]
output = "score"

[accepts]
formats = ["png", "jpeg"]

[cost]
# MEASURED 2026-10-02 on an idle 16 core box, replacing a declared 1.4 seconds
# that was wrong by more than ten times and produced a `plan` estimate of 13
# minutes for a job that takes about 2.7 hours. A developer planned an afternoon
# on that figure and abandoned the run.
#
# 15.6 seconds of wall clock per 512 by 512 image, and 107 CPU seconds, because
# `rs_image` forks internally and spreads itself over about 7 cores. That is why
# `cores_per_worker` is 7 rather than 2: throughput measured FLAT at roughly 4
# images a minute whether the run used 3 workers or 14, because one invocation
# already saturates half the machine, and a worker count chosen from the old
# figure just oversubscribes the box.
seconds_per_image = 15.6
peak_rss_mb = 520
cores_per_worker = 7

[invoke]
# Driven through the library, not the command line, because the CLI compares
# its own estimate to a threshold and prints a sentence. See the adapter.
adapter = "plugins/adapters/aletheia_many.py"
entrypoint = "python3"
# The library is cloned to /opt/aletheia but the image's workdir is /data, so
# an import fails without this. Image layout belongs in the entry, not in the
# adapter, which should outlive any one image.
env = [
    "PYTHONPATH=/opt/aletheia",
    # One core per worker, deliberately. Measured on an idle 16 core box: both
    # estimators are single threaded anyway (CPU time equals wall time), and
    # capping the numeric libraries made the RS attack FASTER, 14.6 against
    # 17.7 CPU seconds, because the threads it was spawning only contended.
    # Uncapped, a run at 14 workers drove the load average to 89 on 16 cores
    # through contention that bought nothing.
    "OMP_NUM_THREADS=1",
    "OPENBLAS_NUM_THREADS=1",
    "MKL_NUM_THREADS=1",
    "NUMEXPR_NUM_THREADS=1",
]
argv = ["{adapter}", "rs", "{files}"]

# 16, deliberately smaller than SPA's 64. The saving is the same 0.62 seconds
# per image, but RS costs about 15 seconds an image, so the overhead was only 4%
# of it and there is little to win. What there is to lose grows with the batch:
# every image in one invocation shares its deadline and dies with it, so a batch
# of 64 would put four minutes of finished work behind one container failure.
batch = 16
parser = "number"

[selftest]
must_detect = "fixtures/lsb-0.4bpp.png"
must_clear = "fixtures/clean.png"
# These estimate an embedding RATE, not a probability. The fixture carries
# 0.4 bpp and a clean image sits near zero, so 0.1 separates them with room on
# both sides. A smoke-test decision point, not a calibrated operating point.
threshold = 0.1
