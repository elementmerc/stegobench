# A structural scanner: it reads the FILE rather than decoding the picture,
# which is the half of the problem most detectors here never look at. On the
# appended-data arm it caught 100% with no false alarms while every pixel-domain
# detector sat at chance.
#
# Output is a verdict, not a score, so it contributes a detection rate and a
# false-alarm rate but no ROC curve. That is a property of the tool, not a
# shortcoming of the harness.
#
# Parsing note: on a JPEG it writes its finding AND its crash to stderr and
# nothing to stdout. The parser reads both streams. Three separate bugs came
# from not knowing that.
name = "zsteg"
kind = "detector"
upstream = "https://github.com/zed-0xff/zsteg"
licence = "MIT"
redistribution = "permitted"
redistribution_reason = """
MIT. The gem and its licence ship inside the image.
"""
maintainer = "third_party"

[image]
reference = "stegobench/zsteg@sha256:00c110ec4a37b87449872a565c2bb86eb6e93f28fde27829d98d1c7168ba68db"
size_mb = 287
bundled = true

[emits]
output = "verdict"

[accepts]
formats = ["png", "bmp"]

[cost]
# MEASURED 2026-10-02: 0.72 seconds per image end to end, serially, against a
# declared 0.1. The old figure was not wrong about zsteg, it was wrong about the
# run: zsteg's own work really is about 0.1 seconds, and the other 0.62 is
# starting a container and loading Ruby, which this entry pays once per image
# because it is not batched. What `plan` has to predict is the run, so the
# number here is the run.
seconds_per_image = 0.72
peak_rss_mb = 120
cores_per_worker = 1

[invoke]
# No leading `zsteg`. The image's ENTRYPOINT is already `["zsteg"]` and docker
# appends argv to it, so naming the program here ran `zsteg zsteg -a <file>`:
# zsteg took the extra word as a second filename, failed to open it, and
# printed an ENOENT before it got to the real image. The scan itself was
# unaffected, which is why it went unnoticed, but every run carried a Ruby
# error somebody reading the output would reasonably think was theirs.
#
# `--no-file --no-strings`, AND THEY ARE WHAT MAKES THIS ENTRY WORK AT ALL.
#
# `--file` (on by default) runs the `file` command over everything zsteg
# extracts, to guess what the bits are. It writes a tempfile to do it, and
# under this project's read-only sandbox that is an immediate Ruby traceback
# and exit 1: zsteg could not process a single image here, on any run, and
# said so only on stderr. `--strings` is the other half, finding ASCII runs in
# extracted bitplanes.
#
# Both are what made zsteg useless in both directions. Under the sandbox it
# crashed on every image; given a writable /tmp it stopped crashing and
# started calling random bits out of a CLEAN image an OpenPGP key or an
# archive, which its own two-sided self-test caught. The earlier attempt to
# fix this went at the sandbox (`--tmpfs /tmp`) and had to be reverted,
# because loosening the sandbox cannot make a noisy check quiet.
#
# Turning the two heuristics off instead leaves exactly the arm this entry
# declares and the self-test fixtures test: the structural one. Measured
# 2026-10-03 under the real sandbox, three clean photographs give exit 0 and
# zero finding markers, and an image with 29 bytes after IEND is still
# reported with its payload. The scan over bitplanes still runs; what is gone
# is guessing what the extracted bits mean, which was never this entry's job.
argv = ["--no-file", "--no-strings", "-a", "{file}"]
parser = "zsteg"

[selftest]
# A STRUCTURAL fixture, not the LSB one. zsteg reads the container and looks
# for extractable text or a file; it never decodes the picture. Asked about
# uniform random bits in the LSB plane it correctly says nothing, so testing it
# with the LSB fixture fails a working tool and proves nothing. This is the
# arm it actually owns, and the one it caught 100% of with no false alarms.
must_detect = "fixtures/appended.png"
must_clear = "fixtures/clean.png"
