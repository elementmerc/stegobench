# Sample Pair Analysis. Driven through aletheialib rather than the CLI: the
# command line compares its own estimate to a threshold and prints a sentence,
# discarding the number an ROC curve needs.
name = "aletheia-spa"
kind = "detector"
upstream = "https://github.com/daniellerch/aletheia"
licence = "MIT"
redistribution = "permitted"
redistribution_reason = """
MIT. Same image as aletheia-rs and the same reasoning: the notice ships
inside the image with the cloned repository.
"""
maintainer = "third_party"

[image]
reference = "stegobench/aletheia@sha256:3f19136f8f3e1479fc60e9986d8d2431818ca6dc4471ae1e49c5076acfccf87d"
size_mb = 8340
bundled = false
needs_network = false

[emits]
output = "score"
higher_means_stego = true

[accepts]
formats = ["png", "jpeg"]

[cost]
# MEASURED 2026-10-02: 0.67 seconds of work per 512 by 512 image, which is close
# to the 0.8 this used to declare. The figure is now 0.7 rather than 1.3 because
# this entry batches 64 images per container, so the roughly 0.62 seconds of
# container start and interpreter import that an unbatched run pays per image is
# amortised to about 10 milliseconds.
seconds_per_image = 0.7
peak_rss_mb = 420
cores_per_worker = 1

[invoke]
# Driven through the library, not the command line, because the CLI compares
# its own estimate to a threshold and prints a sentence. See the adapter.
adapter = "plugins/adapters/aletheia_many.py"
entrypoint = "python3"
# The library is cloned to /opt/aletheia but the image's workdir is /data, so
# an import fails without this. Image layout belongs in the entry, not in the
# adapter, which should outlive any one image.
env = [
    "PYTHONPATH=/opt/aletheia",
    # One core per worker, deliberately. Measured on an idle 16 core box: both
    # estimators are single threaded anyway (CPU time equals wall time), and
    # capping the numeric libraries made the RS attack FASTER, 14.6 against
    # 17.7 CPU seconds, because the threads it was spawning only contended.
    # Uncapped, a run at 14 workers drove the load average to 89 on 16 cores
    # through contention that bought nothing.
    "OMP_NUM_THREADS=1",
    "OPENBLAS_NUM_THREADS=1",
    "MKL_NUM_THREADS=1",
    "NUMEXPR_NUM_THREADS=1",
]
argv = ["{adapter}", "spa", "{files}"]

# 64 images per invocation. SPA's own work is 0.67 seconds against roughly
# 0.62 seconds of container start and interpreter import, so unbatched it spent
# close to half its time getting ready. At 64 the overhead amortises to about
# 10 milliseconds an image.
batch = 64
parser = "number"

[selftest]
must_detect = "fixtures/lsb-0.4bpp.png"
must_clear = "fixtures/clean.png"
# These estimate an embedding RATE, not a probability. The fixture carries
# 0.4 bpp and a clean image sits near zero, so 0.1 separates them with room on
# both sides. A smoke-test decision point, not a calibrated operating point.
threshold = 0.1
