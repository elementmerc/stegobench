[tox]
envlist = py3
skipsdist = true

[testenv]
deps =
    -r requirements.txt
    pytest
    pillow
    numpy
setenv =
    # The binary is staged into the image at this path by the Dockerfile. Point
    # it elsewhere to test against a local build; leave it unset and the plugin
    # degrades to the structural check alone, which is itself worth testing.
    STEGCORE_BINARY = {env:STEGCORE_BINARY:/opt/stegcore/stegcore}
commands =
    pytest {posargs}
    test_plugin --standalone plugin.py

[testenv:regenerate]
deps = {[testenv]deps}
setenv = {[testenv]setenv}
commands = test_plugin --standalone plugin.py --regenerate

[testenv:package]
deps = hansken-extraction-plugin==0.10.0
commands = build_plugin . {posargs}

[testenv:integration-test]
deps = hansken-extraction-plugin==0.10.0
commands =
  build_plugin . plugin-to-test {posargs}
  test_plugin --docker plugin-to-test

[testenv:upgrade]
deps = pip-tools
commands =
  pip-compile --upgrade --no-header --no-emit-options --strip-extras --output-file requirements.txt requirements.in
