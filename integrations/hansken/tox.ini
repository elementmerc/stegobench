[tox]
envlist = py3
skipsdist = true

# WHY THE SDK FRAMEWORK IS NOT IN THE DEFAULT RUN
#
# `test_plugin --standalone` compares against golden traces in
# `testdata/result/`, and those were recorded WITH the analyser present. On a
# machine without a build of Stegcore it fails 4 of 9, which meant the
# documented command was broken for everyone but the author, and the degraded
# mode the README advertises had no coverage at all.
#
# So the default run is pytest, which covers both modes through a stand-in
# trace, and the SDK comparison is its own environment for when the binary is
# there. `tox -e sdk` needs STEGCORE_BINARY set.

[testenv]
deps =
    -r requirements.txt
    pytest
    pillow
    numpy
commands = pytest {posargs}

[testenv:sdk]
deps = {[testenv]deps}
passenv = STEGCORE_BINARY
commands = test_plugin --standalone plugin.py

[testenv:regenerate]
deps = {[testenv]deps}
passenv = STEGCORE_BINARY
commands = test_plugin --standalone plugin.py --regenerate

[testenv:package]
deps = hansken-extraction-plugin==0.10.0
commands = build_plugin . {posargs}

[testenv:integration-test]
deps = hansken-extraction-plugin==0.10.0
commands =
  build_plugin . plugin-to-test {posargs}
  test_plugin --docker plugin-to-test

[testenv:upgrade]
deps = pip-tools
commands =
  pip-compile --upgrade --no-header --no-emit-options --strip-extras --output-file requirements.txt requirements.in
